# NOTE: this is a beginner-friendly example. In real production, create
# this secret out-of-band (e.g. `kubectl create secret ...` or a secrets
# manager) instead of committing base64 "secrets" to git.
#
# Values below are base64 for: root_password / ttt_user / ttt_password / ttt_stats
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: tictactoe
type: Opaque
data:
  mysql-root-password: cm9vdF9wYXNzd29yZA==
  mysql-user: dHR0X3VzZXI=
  mysql-password: dHR0X3Bhc3N3b3Jk
  mysql-database: dHR0X3N0YXRz
