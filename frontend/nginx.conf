server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA - any unknown path falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend microservices.
    # Service names below match the Docker Compose service names AND
    # the Kubernetes Service names, so this config works unchanged in both.
    location /api/game/ {
        proxy_pass http://game-service:5001/;
        proxy_set_header Host $host;
    }

    location /api/player/ {
        proxy_pass http://player-service:5002/;
        proxy_set_header Host $host;
    }

    location /api/match/ {
        proxy_pass http://match-service:5000/;
        proxy_set_header Host $host;
    }

    location /api/stats/ {
        proxy_pass http://stats-service:5003/;
        proxy_set_header Host $host;
    }
}
